<style>

*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,rgba(124,108,255,.15),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(33,230,255,.08),transparent 55%),var(--bg)}
.wrap{max-width:1280px;margin:auto;padding:28px 28px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px;box-shadow:0 0 22px rgba(124,108,255,.35)}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.header-actions{display:flex;gap:9px;align-items:center}.btn,.select,.search{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;height:40px;padding:0 13px;font:inherit}.btn{cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),#8d5cff);color:var(--accentText);border-color:transparent;font-weight:650;box-shadow:0 6px 22px rgba(124,108,255,.2)}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;margin:0 0 22px;background:linear-gradient(90deg,rgba(124,108,255,.12),rgba(33,230,255,.08),rgba(255,79,216,.10));border:1px solid rgba(124,108,255,.35);border-radius:14px;font-size:13px;color:var(--text);position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(124,108,255,.18),transparent);animation:bannerSweep 6s linear infinite;pointer-events:none}
@keyframes bannerSweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.banner a{color:var(--cyan);font-weight:750;text-decoration:none;border-bottom:1px dashed rgba(33,230,255,.5);text-underline-offset:3px;transition:.2s}
.banner a:hover{color:var(--pink);border-bottom-color:var(--pink);text-shadow:0 0 12px rgba(255,79,216,.4)}
.banner-tag{background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.5px}
.hero{display:flex;justify-content:space-between;align-items:end;margin:18px 0 22px}.hero h2{font-size:36px;line-height:1;margin:0 0 10px;letter-spacing:-1.7px;background:linear-gradient(120deg,var(--text) 40%,var(--accent) 75%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:14px}.search{width:280px;padding-left:14px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600;transition:.15s}.tab:hover{color:var(--text)}.tab.active{background:linear-gradient(135deg,rgba(124,108,255,.16),rgba(33,230,255,.08));color:var(--text);box-shadow:0 0 0 1px rgba(124,108,255,.45),0 0 18px rgba(124,108,255,.08)}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 16px}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center}.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.22s ease;position:relative}.card::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;transition:.3s;box-shadow:inset 0 0 40px rgba(124,108,255,.12)}.card:hover{transform:translateY(-4px);border-color:rgba(124,108,255,.55);box-shadow:0 18px 46px rgba(50,40,150,.18),0 0 30px rgba(33,230,255,.06)}.card:hover::after{opacity:1}
.photo{height:250px;background:var(--surface2);position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}.card:hover .photo img{transform:scale(1.04)}.badge{position:absolute;top:11px;left:11px;background:rgba(7,9,18,.82);color:#fff;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:750;border:1px solid rgba(124,108,255,.45);backdrop-filter:blur(8px)}.heart{position:absolute;right:11px;top:11px;width:34px;height:34px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(7,9,18,.72);color:#fff;cursor:pointer;font-size:17px;backdrop-filter:blur(8px)}.heart.saved{color:var(--pink)}.content{padding:15px}.topline{display:flex;justify-content:space-between;gap:12px}.name{font-weight:750;font-size:15px;letter-spacing:-.2px}.seller{color:var(--muted);font-size:12px;margin-top:4px}.price{font-weight:800;font-size:15px;white-space:nowrap}.subprice{color:var(--muted);font-size:11px;text-align:right;margin-top:3px}.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 0 13px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.rating{color:var(--text);font-weight:650}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.action{height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-weight:650;font-size:11px;cursor:pointer;transition:.15s}.action:hover{border-color:rgba(124,108,255,.5);background:var(--surface2)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex;animation:fadeIn .2s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h3{margin:0}.close{border:0;background:var(--surface2);color:var(--text);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px}.close:hover{background:var(--border)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:var(--surface2);cursor:pointer;transition:.2s}.gallery img:hover{transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.detail{background:var(--surface2);padding:12px;border-radius:10px}.detail span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.admin-grid input,.admin-grid textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:11px;font:inherit}.admin-grid textarea{min-height:80px;resize:vertical}.admin-wide{grid-column:1/-1}.admin-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.admin-note{color:var(--muted);font-size:12px;margin:5px 0 0}
.upload-row{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload-row input[type=file]{display:none}.upload-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:650}.upload-btn:hover{border-color:var(--accent);color:var(--accent)}
.thumb-strip{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}.thumb{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(7,9,18,.85);color:#fff;cursor:pointer;font-size:12px;line-height:1}
.fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-size:26px;font-weight:300;cursor:pointer;box-shadow:0 10px 30px rgba(124,108,255,.45),0 0 26px rgba(33,230,255,.25);display:none;z-index:4;transition:.2s}.fab.show{display:grid;place-items:center}.fab:hover{transform:scale(1.07)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;background:var(--accent);color:var(--accentText);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:650;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:stretch;flex-direction:column;gap:18px}.search{width:100%}.banner{font-size:12px;flex-wrap:wrap;text-align:center}}@media(max-width:600px){.wrap{padding:18px 14px 35px}.grid{grid-template-columns:1fr}.photo{height:290px}.header-actions .select{display:none}.toolbar{align-items:stretch;flex-direction:column}.toolbar-right{justify-content:space-between}.details{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.gallery img{height:140px}.fab{bottom:18px;right:18px}}

<body>
<div id="app"><main class="wrap">
<header><div class="brand"><div class="mark">RI</div><div><h1>Replica Index</h1><p>Independent fashion catalogue</p></div></div><div class="header-actions"><select class="select" id="currency"><option>AUD</option><option>USD</option><option>EUR</option><option>GBP</option><option>CNY</option></select><button class="btn" id="savedBtn">♡ Saved</button><button class="btn" id="authBtn">Log in</button><button class="btn primary" id="addBtn" style="display:none">+ Add item</button></div></header>

<div class="banner">
  <span class="banner-tag">TIP</span>
  <span>This site is heavily compatible with Kakobuy —</span>
  <a href="https://ikako.vip/r/9enta" target="_blank" rel="noopener">get mega discounts ↗</a>
</div>

<section class="hero"><div><h2>Find your next piece.</h2><p>A clean catalogue for comparing listings, prices and QC photos.</p></div><input class="search" id="search" placeholder="Search brand, item or seller…"></section>
<nav class="tabs" id="tabs"></nav>
<div class="toolbar"><div class="count" id="count"></div><div class="toolbar-right"><select class="select" id="sort"><option value="featured">Featured</option><option value="low">Price: low → high</option><option value="high">Price: high → low</option></select></div></div>
<section class="grid" id="grid"></section>
</main></div>
<button class="fab" id="fab" title="Add item">+</button>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="modal" id="adminModal"><div class="modal-box" id="adminBox"></div></div><div class="modal" id="authModal"><div class="modal-box" id="authBox"></div></div><div class="toast" id="toast"></div>
<script>
const rates={CNY:1,AUD:0.215,USD:0.139,EUR:0.119,GBP:0.103};
const SUPABASE_URL = 'https://xbhqvoapbfhyhcrhafxm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhiaHF2b2FwYmZoeWhjcmhhZnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjUxNTcsImV4cCI6MjEwNjUwMTE1N30.w-AH-743HhJjDwazZg-AdkuotzANoCd7kwXH6exIo-g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let currentUser = null;

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').order('id');
  if (error) { console.error('Supabase error:', error); showToast('Could not load items.'); return; }
  products = data.map(row => {
    const imgs = Array.isArray(row.images) ? row.images.filter(Boolean) : [];
    const main = row.image || imgs[0] || '';
    return {
      id: row.id, name: row.name, brand: row.brand, category: row.category,
      seller: row.seller, cny: row.cny, rating: row.rating, qc: row.qc,
      status: row.status, image: main, images: imgs.length ? imgs : (main ? [main] : []),
      links: { product: row.product_link, affiliate: row.affiliate_link },
      notes: row.notes
    };
  });
  render();
  decorateCards();
}

function refreshAuthUI() {
  const addBtn = $('#addBtn'), authBtn = $('#authBtn'), fab = $('#fab');
  if (currentUser) {
    addBtn.style.display = ''; fab.classList.add('show'); authBtn.textContent = 'Log out';
  } else {
    addBtn.style.display = 'none'; fab.classList.remove('show'); authBtn.textContent = 'Log in';
  }
}

function openAuth() {
  if (currentUser) {
    sb.auth.signOut().then(() => { currentUser = null; refreshAuthUI(); showToast('Logged out.'); });
    return;
  }
  $('#authBox').innerHTML = `
    <div class="modal-head"><div><h3>Admin login</h3><p class="admin-note">Only the owner can add or edit items.</p></div><button class="close" onclick="closeAuth()">×</button></div>
    <div class="admin-grid">
      <input class="admin-wide" id="authEmail" type="email" placeholder="Email" autocomplete="username">
      <input class="admin-wide" id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="admin-actions">
      <button class="btn" onclick="closeAuth()">Cancel</button>
      <button class="btn primary" id="authSubmit">Log in</button>
    </div>`;
  $('#authModal').classList.add('open');
  $('#authSubmit').onclick = async () => {
    const email = $('#authEmail').value.trim();
    const password = $('#authPass').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showToast('Login failed: ' + error.message); return; }
    currentUser = data.user; closeAuth(); refreshAuthUI(); showToast('Logged in.');
  };
}
function closeAuth(){ $('#authModal').classList.remove('open'); }

let currency='AUD',active='All',query='',sort='featured',saved=new Set();
const $=s=>document.querySelector(s); const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency}).format(n*rates[currency]);
function renderTabs(){const cats=['All',...new Set(products.map(p=>p.category))];$('#tabs').innerHTML=cats.map(c=>`<button class="tab ${active===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function filtered(){let a=products.filter(p=>(active==='All'||p.category===active)&&(`${p.name} ${p.brand} ${p.seller}`.toLowerCase().includes(query.toLowerCase())));if($('#savedBtn').dataset.active==='1')a=a.filter(p=>saved.has(p.id));if(sort==='low')a.sort((a,b)=>a.cny-b.cny);if(sort==='high')a.sort((a,b)=>b.cny-a.cny);if(sort==='rating')a.sort((a,b)=>b.rating-a.rating);return a}
function render(){renderTabs();const a=filtered();$('#count').textContent=`${a.length} ${a.length===1?'item':'items'}`;$('#grid').innerHTML=a.length?a.map(card).join(''):`<div class="empty">No items match your filters.</div>`}
function card(p){return `<article class="card"><div class="photo"><img src="${p.image}" alt="${p.name}" onerror="this.style.opacity=.15"><span class="badge">${p.status}</span><button class="heart ${saved.has(p.id)?'saved':''}" onclick="toggleSave(${p.id})">${saved.has(p.id)?'♥':'♡'}</button></div><div class="content"><div class="topline"><div><div class="name">${p.name}</div><div class="seller">${p.brand} · ${p.seller}</div></div><div><div class="price">${money(p.cny)}</div><div class="subprice">¥${p.cny} CNY</div></div></div><div class="meta"><span class="rating">★ ${p.rating}</span><span>▣ ${p.qc} QC photos</span></div><div class="actions"><button class="action" onclick="openProduct(${p.id})">Product ↗</button><button class="action" onclick="openQC(${p.id})">QC photos</button><button class="action aff" onclick="openAffiliate(${p.id})">Affiliate ↗</button></div></div></article>`}
function openProduct(id){window.open(products.find(p=>p.id===id).links.product,'_blank','noopener')}
function openAffiliate(id){window.open(products.find(p=>p.id===id).links.affiliate,'_blank','noopener')}
function openQC(id){
  const p=products.find(p=>p.id===id);
  const imgs = (p.images && p.images.length ? p.images : (p.image ? [p.image] : []));
  const gallery = imgs.length
    ? imgs.map((u,i)=>`<img src="${u}" alt="QC photo ${i+1}" onclick="window.open('${u}','_blank','noopener')">`).join('')
    : `<div class="detail" style="grid-column:1/-1">No images yet.</div>`;
  $('#modalBox').innerHTML=`<div class="modal-head"><div><h3>${p.name}</h3><div class="seller">${p.brand} · ${p.seller}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="gallery">${gallery}</div><div class="details"><div class="detail"><span>Price</span>${money(p.cny)}</div><div class="detail"><span>Notes</span>${p.notes||'—'}</div><div class="detail"><span>Seller</span>${p.seller}</div><div class="detail"><span>Images</span>${imgs.length}</div></div>`;
  $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open')};function closeAdmin(){$('#adminModal').classList.remove('open')}; function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);render()};function setCat(c){active=c;render()}

let draftImages = [];

function renderThumbs(){
  const wrap = $('#thumbStrip');
  if(!wrap) return;
  wrap.innerHTML = draftImages.map((u,i)=>`<div class="thumb"><img src="${u}"><button onclick="removeThumb(${i})">×</button></div>`).join('');
}
function removeThumb(i){ draftImages.splice(i,1); renderThumbs(); }

async function handleUpload(files){
  if(!currentUser){ showToast('Log in first.'); return; }
  for(const file of files){
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await sb.storage.from('item-images').upload(path, file, { cacheControl:'31536000', upsert:false });
    if(error){ console.error(error); showToast('Upload failed: '+error.message); continue; }
    const { data } = sb.storage.from('item-images').getPublicUrl(path);
    draftImages.push(data.publicUrl);
  }
  renderThumbs();
  showToast('Uploaded.');
}

function openAdmin(id=null){
  if(!currentUser){showToast('Log in first.');return}
  const p=id?products.find(x=>x.id===id):null;
  draftImages = p && p.images ? [...p.images] : [];
  $('#adminBox').innerHTML=`<div class="modal-head"><div><h3>${p?'Edit item':'Add item'}</h3><p class="admin-note">Owner controls — manage catalogue details and affiliate links.</p></div><button class="close" onclick="closeAdmin()">×</button></div><div class="admin-grid"><input id="aName" placeholder="Product name" value="${p?.name||''}"><input id="aBrand" placeholder="Brand" value="${p?.brand||''}"><input id="aCategory" placeholder="Category" value="${p?.category||''}"><input id="aSeller" placeholder="Seller" value="${p?.seller||''}"><input id="aPrice" type="number" placeholder="Price (CNY)" value="${p?.cny||''}"><input id="aRating" type="number" step=".1" min="0" max="5" placeholder="Rating" value="${p?.rating||''}"><input id="aQc" type="number" min="0" placeholder="QC photo count" value="${p?.qc||''}"><input id="aStatus" placeholder="Status" value="${p?.status||'In stock'}">
  <div class="upload-row">
    <label class="upload-btn" for="aFiles">⬆ Upload images</label>
    <input id="aFiles" type="file" accept="image/*" multiple>
    <span class="admin-note">or paste URLs below</span>
  </div>
  <div class="thumb-strip" id="thumbStrip"></div>
  <input class="admin-wide" id="aImage" placeholder="Main image URL (optional if uploaded)" value="${p?.image||''}">
  <input class="admin-wide" id="aProduct" placeholder="Product link" value="${p?.links.product||''}"><input class="admin-wide" id="aAffiliate" placeholder="Affiliate link" value="${p?.links.affiliate||''}"><textarea class="admin-wide" id="aNotes" placeholder="Notes">${p?.notes||''}</textarea></div><div class="admin-actions">${p?'<button class="btn" style="color:var(--pink)" id="aDelete">Delete</button>':''}<button class="btn" onclick="closeAdmin()">Cancel</button><button class="btn primary" id="aSave">${p?'Save changes':'Add item'}</button></div>`;
  $('#adminModal').classList.add('open');
  renderThumbs();
  $('#aFiles').onchange = e => handleUpload(e.target.files);
  $('#aSave').onclick=()=>saveAdmin(p?.id||null);
  if(p) $('#aDelete').onclick=()=>deleteAdmin(p.id);
}

async function saveAdmin(id){
  if(!currentUser){showToast('Not logged in.');return}
  const urlImage = $('#aImage').value.trim();
  const finalImages = [...draftImages];
  if(urlImage && !finalImages.includes(urlImage)) finalImages.unshift(urlImage);
  const data={
    name:$('#aName').value.trim(),
    brand:$('#aBrand').value.trim(),
    category:$('#aCategory').value.trim()||'Other',
    seller:$('#aSeller').value.trim(),
    cny:Number($('#aPrice').value)||0,
    rating:Number($('#aRating').value)||0,
    qc:Number($('#aQc').value)||finalImages.length,
    status:$('#aStatus').value.trim()||'In stock',
    image: finalImages[0] || urlImage || '',
    images: finalImages,
    product_link:$('#aProduct').value.trim(),
    affiliate_link:$('#aAffiliate').value.trim(),
    notes:$('#aNotes').value.trim()
  };
  if(!data.name){showToast('Add a product name first.');return}
  let error;
  if(id){ ({error} = await sb.from('products').update(data).eq('id',id)); }
  else  { ({error} = await sb.from('products').insert(data)); }
  if(error){console.error(error);showToast('Save failed: '+error.message);return}
  closeAdmin();
  await loadProducts();
  showToast(id?'Item updated.':'Item added.');
}

async function deleteAdmin(id){
  if(!currentUser){showToast('Not logged in.');return}
  if(!confirm('Delete this item permanently?')) return;
  const { error } = await sb.from('products').delete().eq('id',id);
  if(error){console.error(error);showToast('Delete failed: '+error.message);return}
  closeAdmin();
  await loadProducts();
  showToast('Item deleted.');
}
