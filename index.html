<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replica Index</title>
<style>
:root { color-scheme: light dark; --bg: light-dark(#f4f7ff,#070912); --surface: light-dark(#ffffff,#0d1220); --surface2: light-dark(#edf2ff,#11182a); --text: light-dark(#10152a,#f4f7ff); --muted: light-dark(#66708a,#929bb5); --border: light-dark(#d9e0f2,#202a43); --accent: light-dark(#5b4bff,#7c6cff); --accentText:#ffffff; --cyan:#21e6ff; --pink:#ff4fd8; --green:#46e6a5; }
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background:var(--bg)} .wrap{max-width:1280px;margin:auto;padding:28px 28px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px;box-shadow:0 0 22px rgba(124,108,255,.35)}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.header-actions{display:flex;gap:9px;align-items:center}.btn,.select,.search{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;height:40px;padding:0 13px;font:inherit}.btn{cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),#8d5cff);color:var(--accentText);border-color:transparent;font-weight:650;box-shadow:0 6px 22px rgba(124,108,255,.2)}.hero{display:flex;justify-content:space-between;align-items:end;margin:18px 0 22px}.hero h2{font-size:34px;line-height:1;margin:0 0 8px;letter-spacing:-1.6px}.hero p{margin:0;color:var(--muted);font-size:14px}.search{width:280px;padding-left:14px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600}.tab.active{background:linear-gradient(135deg,rgba(124,108,255,.16),rgba(33,230,255,.08));color:var(--text);box-shadow:0 0 0 1px rgba(124,108,255,.45),0 0 18px rgba(124,108,255,.08)}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 16px}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center}.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.18s ease}.card:hover{transform:translateY(-3px);border-color:rgba(124,108,255,.55);box-shadow:0 14px 38px rgba(50,40,150,.14),0 0 24px rgba(33,230,255,.05)}.photo{height:250px;background:var(--surface2);position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:11px;left:11px;background:rgba(7,9,18,.82);color:#fff;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:750;border:1px solid rgba(124,108,255,.45);backdrop-filter:blur(8px)}.heart{position:absolute;right:11px;top:11px;width:34px;height:34px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(7,9,18,.72);color:#fff;cursor:pointer;font-size:17px;backdrop-filter:blur(8px)}.heart.saved{color:var(--pink)}.content{padding:15px}.topline{display:flex;justify-content:space-between;gap:12px}.name{font-weight:750;font-size:15px;letter-spacing:-.2px}.seller{color:var(--muted);font-size:12px;margin-top:4px}.price{font-weight:800;font-size:15px;white-space:nowrap}.subprice{color:var(--muted);font-size:11px;text-align:right;margin-top:3px}.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 0 13px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.rating{color:var(--text);font-weight:650}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.action{height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-weight:650;font-size:11px;cursor:pointer}.action.aff{background:linear-gradient(135deg,var(--accent),#8d5cff);color:var(--accentText);border-color:transparent;box-shadow:0 0 15px rgba(124,108,255,.16)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modal-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.close{border:0;background:var(--surface2);color:var(--text);width:34px;height:34px;border-radius:9px;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:var(--surface2)}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.detail{background:var(--surface2);padding:12px;border-radius:10px}.detail span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.admin-grid input,.admin-grid textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:11px;font:inherit}.admin-grid textarea{min-height:80px;resize:vertical}.admin-wide{grid-column:1/-1}.admin-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.admin-note{color:var(--muted);font-size:12px;margin:5px 0 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;background:var(--accent);color:var(--accentText);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:650;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:stretch;flex-direction:column;gap:18px}.search{width:100%}}@media(max-width:600px){.wrap{padding:18px 14px 35px}.grid{grid-template-columns:1fr}.photo{height:290px}.header-actions .select{display:none}.toolbar{align-items:stretch;flex-direction:column}.toolbar-right{justify-content:space-between}.details{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.gallery img{height:140px}}
</style>
<style>.action.aff{grid-column:1/-1;height:40px;background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5,#21e6ff,#46e6a5,#ffe66d,#ff3cac);background-size:300% 100%;color:#fff;border-color:transparent;box-shadow:0 0 18px rgba(255,79,216,.18),0 0 22px rgba(33,230,255,.12);animation:rainbow 5s linear infinite;font-size:12px;font-weight:800}.action.aff:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(255,79,216,.28),0 0 28px rgba(33,230,255,.18)}.discount-link{display:inline-block;margin:0 0 10px;color:var(--cyan);font-size:10px;font-weight:750;text-decoration:underline;text-underline-offset:3px}.discount-link:hover{color:var(--pink)}@keyframes rainbow{0%{background-position:0% 50%}100%{background-position:300% 50%}}</style>
</head>
<body>
<div id="app"><main class="wrap">
<header><div class="brand"><div class="mark">RI</div><div><h1>Replica Index</h1><p>Independent fashion catalogue</p></div></div><div class="header-actions"><select class="select" id="currency"><option>AUD</option><option>USD</option><option>EUR</option><option>GBP</option><option>CNY</option></select><button class="btn" id="savedBtn">♡ Saved</button><button class="btn primary" id="addBtn">+ Add item</button></div></header>
<section class="hero"><div><h2>Find your next piece.</h2><p>A clean catalogue for comparing listings, prices and QC photos.</p></div><input class="search" id="search" placeholder="Search brand, item or seller…"></section>
<nav class="tabs" id="tabs"></nav>
<div class="toolbar"><div class="count" id="count"></div><div class="toolbar-right"><select class="select" id="sort"><option value="featured">Featured</option><option value="low">Price: low → high</option><option value="high">Price: high → low</option></select></div></div>
<section class="grid" id="grid"></section>
</main></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="modal" id="adminModal"><div class="modal-box" id="adminBox"></div></div><div class="toast" id="toast"></div>
<script>
const rates={CNY:1,AUD:0.215,USD:0.139,EUR:0.119,GBP:0.103};
const products=[
{id:7,name:'Example Kakobuy Listing',brand:'Example Listing',category:'Examples',seller:'Kakobuy',cny:0,rating:0,qc:0,status:'Example',image:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80',links:{product:'https://item.kakobuy.com/item/details?url=https%3A%2F%2Fitem.taobao.com%2Fitem.htm%3Fid%3D1045798874356%26mi_id%3D0000wvq_Ki2U5inu3mmGKx4y57CMwfe-ha6L1q-OBrF2tq0',affiliate:'https://ikako.vip/r/9enta'},notes:'Example listing added to demonstrate how an external product page can appear in the catalogue.'},
{id:1,name:'Washed Zip Hoodie',brand:'Studio Archive',category:'Hoodies',seller:'Northstar',cny:268,rating:4.8,qc:6,status:'In stock',image:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=80',links:{product:'https://example.com/product-1',affiliate:'https://example.com/affiliate-1'},notes:'Heavyweight fleece. Relaxed fit.'},
{id:2,name:'Retro Runner 2002',brand:'New Balance',category:'Shoes',seller:'Orbit Supply',cny:420,rating:4.7,qc:12,status:'In stock',image:'https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=900&q=80',links:{product:'https://example.com/product-2',affiliate:'https://example.com/affiliate-2'},notes:'Compare outsole and heel shape in QC.'},
{id:3,name:'Technical Shell Jacket',brand:'Alpine Works',category:'Jackets',seller:'Northstar',cny:598,rating:4.9,qc:9,status:'Low stock',image:'https://images.unsplash.com/photo-1544966503-7cc5ac882d5f?auto=format&fit=crop&w=900&q=80',links:{product:'https://example.com/product-3',affiliate:'https://example.com/affiliate-3'},notes:'Water-resistant shell. Boxy cut.'},
{id:4,name:'Logo Knit Beanie',brand:'Studio Archive',category:'Accessories',seller:'Harbour Finds',cny:118,rating:4.5,qc:4,status:'In stock',image:'https://images.unsplash.com/photo-1575428652377-a2d80e2277fc?auto=format&fit=crop&w=900&q=80',links:{product:'https://example.com/product-4',affiliate:'https://example.com/affiliate-4'},notes:'Soft knit with embroidered logo.'},
{id:5,name:'Vintage Wash Tee',brand:'Archive Dept.',category:'T-Shirts',seller:'Orbit Supply',cny:168,rating:4.6,qc:8,status:'In stock',image:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80',links:{product:'https://example.com/product-5',affiliate:'https://example.com/affiliate-5'},notes:'Oversized fit. Check measurements.'},
{id:6,name:'Quilted Puffer',brand:'Alpine Works',category:'Jackets',seller:'Harbour Finds',cny:488,rating:4.8,qc:10,status:'In stock',image:'https://images.unsplash.com/photo-1548883354-7622d03aca27?auto=format&fit=crop&w=900&q=80',links:{product:'https://example.com/product-6',affiliate:'https://example.com/affiliate-6'},notes:'High collar and cropped hem.'}
];
let currency='AUD',active='All',query='',sort='featured',saved=new Set();
const $=s=>document.querySelector(s); const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency}).format(n*rates[currency]);
function renderTabs(){const cats=['All',...new Set(products.map(p=>p.category))];$('#tabs').innerHTML=cats.map(c=>`<button class="tab ${active===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function filtered(){let a=products.filter(p=>(active==='All'||p.category===active)&&(`${p.name} ${p.brand} ${p.seller}`.toLowerCase().includes(query.toLowerCase())));if($('#savedBtn').dataset.active==='1')a=a.filter(p=>saved.has(p.id));if(sort==='low')a.sort((a,b)=>a.cny-b.cny);if(sort==='high')a.sort((a,b)=>b.cny-a.cny);if(sort==='rating')a.sort((a,b)=>b.rating-a.rating);return a}
function render(){renderTabs();const a=filtered();$('#count').textContent=`${a.length} ${a.length===1?'item':'items'}`;$('#grid').innerHTML=a.length?a.map(card).join(''):`<div class="empty">No items match your filters.</div>`}
function card(p){return `<article class="card"><div class="photo"><img src="${p.image}" alt="${p.name}"><span class="badge">${p.status}</span><button class="heart ${saved.has(p.id)?'saved':''}" onclick="toggleSave(${p.id})">${saved.has(p.id)?'♥':'♡'}</button></div><div class="content"><div class="topline"><div><div class="name">${p.name}</div><div class="seller">${p.brand} · ${p.seller}</div></div><div><div class="price">${money(p.cny)}</div><div class="subprice">¥${p.cny} CNY</div></div></div><div class="meta"><span class="rating">★ ${p.rating}</span><span>▣ ${p.qc} QC photos</span></div><div class="actions"><button class="action" onclick="openProduct(${p.id})">Product ↗</button><button class="action" onclick="openQC(${p.id})">QC photos</button><button class="action aff" onclick="openAffiliate(${p.id})">Affiliate ↗</button></div></div></article>`}
function openProduct(id){window.open(products.find(p=>p.id===id).links.product,'_blank','noopener')}
function openAffiliate(id){window.open(products.find(p=>p.id===id).links.affiliate,'_blank','noopener')}
function openQC(id){const p=products.find(p=>p.id===id);$('#modalBox').innerHTML=`<div class="modal-head"><div><h3>${p.name}</h3><div class="seller">${p.brand} · ${p.seller}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="gallery">${Array.from({length:Math.min(p.qc,6)},(_,i)=>`<img src="${p.image}" alt="QC photo ${i+1}">`).join('')}</div><div class="details"><div class="detail"><span>Price</span>${money(p.cny)}</div><div class="detail"><span>Notes</span>${p.notes}</div><div class="detail"><span>Seller</span>${p.seller}</div><div class="detail"><span>QC count</span>${p.qc} photos</div></div>`;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')};function closeAdmin(){$('#adminModal').classList.remove('open')}; function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);render()};function setCat(c){active=c;render()}
function openAdmin(id=null){const p=id?products.find(x=>x.id===id):null;$('#adminBox').innerHTML=`<div class="modal-head"><div><h3>${p?'Edit item':'Add item'}</h3><p class="admin-note">Owner controls — manage catalogue details and affiliate links.</p></div><button class="close" onclick="closeAdmin()">×</button></div><div class="admin-grid"><input id="aName" placeholder="Product name" value="${p?.name||''}"><input id="aBrand" placeholder="Brand" value="${p?.brand||''}"><input id="aCategory" placeholder="Category" value="${p?.category||''}"><input id="aSeller" placeholder="Seller" value="${p?.seller||''}"><input id="aPrice" type="number" placeholder="Price (CNY)" value="${p?.cny||''}"><input id="aRating" type="number" step=".1" min="0" max="5" placeholder="Rating" value="${p?.rating||''}"><input id="aQc" type="number" min="0" placeholder="QC photo count" value="${p?.qc||''}"><input id="aStatus" placeholder="Status" value="${p?.status||'In stock'}"><input class="admin-wide" id="aImage" placeholder="Product image URL" value="${p?.image||''}"><input class="admin-wide" id="aProduct" placeholder="Product link" value="${p?.links.product||''}"><input class="admin-wide" id="aAffiliate" placeholder="Affiliate link" value="${p?.links.affiliate||''}"><textarea class="admin-wide" id="aNotes" placeholder="Notes">${p?.notes||''}</textarea></div><div class="admin-actions"><button class="btn" onclick="closeAdmin()">Cancel</button><button class="btn primary" onclick="saveAdmin(${p?.id||'null'})">${p?'Save changes':'Add item'}</button></div>`;$('#adminModal').classList.add('open')}
function saveAdmin(id){const data={name:$('#aName').value.trim(),brand:$('#aBrand').value.trim(),category:$('#aCategory').value.trim()||'Other',seller:$('#aSeller').value.trim(),cny:Number($('#aPrice').value)||0,rating:Number($('#aRating').value)||0,qc:Number($('#aQc').value)||0,status:$('#aStatus').value.trim()||'In stock',image:$('#aImage').value.trim(),links:{product:$('#aProduct').value.trim(),affiliate:$('#aAffiliate').value.trim()},notes:$('#aNotes').value.trim()};if(!data.name){showToast('Add a product name first.');return}if(id){Object.assign(products.find(p=>p.id===id),data)}else{products.push({id:Date.now(),...data})}closeAdmin();render();showToast(id?'Item updated.':'Item added.')}
$('#currency').onchange=e=>{currency=e.target.value;render()};$('#search').oninput=e=>{query=e.target.value;render()};$('#sort').onchange=e=>{sort=e.target.value;render()};$('#savedBtn').onclick=()=>{$('#savedBtn').dataset.active=$('#savedBtn').dataset.active==='1'?'0':'1';$('#savedBtn').textContent=$('#savedBtn').dataset.active==='1'?'♥ Saved':'♡ Saved';render()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#adminModal').onclick=e=>{if(e.target.id==='adminModal')closeAdmin()};$('#addBtn').onclick=()=>openAdmin();function showToast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function decorateCards(){document.querySelectorAll('.rating').forEach(x=>x.remove());document.querySelectorAll('.card').forEach(c=>{if(!c.querySelector('.discount-link')){const a=document.createElement('a');a.className='discount-link';a.href='https://ikako.vip/r/9enta';a.target='_blank';a.rel='noopener';a.textContent='Click me for mega discounts ↗';c.querySelector('.actions').before(a)}});document.querySelectorAll('.action.aff').forEach(b=>{b.innerHTML='Click to purchase';});}
render();decorateCards();
</script></body></html>
