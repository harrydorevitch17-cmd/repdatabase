<style>
:root{color-scheme:light dark;
--bg:light-dark(#eef2ff,#05070f);
--surface:light-dark(rgba(255,255,255,.72),rgba(13,18,32,.55));
--surface2:light-dark(rgba(240,244,255,.6),rgba(20,27,46,.55));
--glass-border:light-dark(rgba(20,25,55,.09),rgba(255,255,255,.09));
--glass-hi:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.14));
--text:light-dark(#0c1226,#f3f6ff);
--muted:light-dark(#5c6b8a,#8e99b8);
--border:light-dark(#d8dff2,#1b2440);
--accent:light-dark(#5b4bff,#7c6cff);
--cyan:#22e6ff}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app{min-height:100vh;background:
radial-gradient(1400px 720px at 12% -12%,rgba(124,108,255,.24),transparent 60%),
radial-gradient(1000px 620px at 100% 0%,rgba(34,230,255,.14),transparent 55%),var(--bg)}
.wrap{max-width:1500px;margin:auto;padding:22px 22px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px;box-shadow:0 0 20px rgba(124,108,255,.45)}
.brand h1{font-size:17px;margin:0;letter-spacing:-.4px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:10.5px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--glass-border);background:var(--surface);color:var(--text);border-radius:11px;height:36px;padding:0 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:0 1px 0 var(--glass-hi) inset;transition:.18s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:rgba(124,108,255,.55);background:var(--surface2)}
.btn.kb{background:linear-gradient(135deg,#ff5c1f,#e6260a);color:#fff;border-color:transparent;font-weight:800;box-shadow:0 6px 22px rgba(230,38,10,.42)}
.btn.kb:hover{box-shadow:0 8px 28px rgba(255,60,20,.6)}
.banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 16px;margin:0 0 20px;
background:linear-gradient(90deg,rgba(222,41,16,.22),rgba(222,41,16,.14) 45%,rgba(255,222,0,.14) 75%,rgba(255,222,0,.22));
border:1px solid rgba(255,140,80,.35);border-radius:13px;font-size:12.5px;color:var(--text);
position:relative;overflow:hidden;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,180,80,.22),transparent);animation:bannerSweep 7s linear infinite;pointer-events:none}
@keyframes bannerSweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.banner a{color:#ffde00;font-weight:750;text-decoration:none;border-bottom:1px dashed rgba(255,222,0,.6);text-shadow:0 0 12px rgba(255,222,0,.25)}
.banner a:hover{color:#fff;border-bottom-color:#fff}
.cn-flag{width:30px;height:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;flex-shrink:0}
.hero{text-align:center;margin:12px 0 22px}
.hero h2{font-size:clamp(22px,3.4vw,34px);line-height:1.1;margin:0 0 8px;letter-spacing:-1.2px;
background:linear-gradient(120deg,var(--text) 38%,var(--accent) 72%,var(--cyan) 100%);
-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 14px;color:var(--muted);font-size:13px}
.hero-cta{margin:0 auto;max-width:380px}
.hero-cta .btn{height:46px;width:100%;justify-content:center;font-size:14px;font-weight:800;border-radius:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;font-size:12px;color:var(--muted)}
.toolbar .mono{color:var(--text);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.skeleton-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;position:relative;backdrop-filter:blur(20px);height:260px}
.skeleton-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:skeletonSweep 1.4s linear infinite;pointer-events:none}
@keyframes skeletonSweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.skeleton-photo{aspect-ratio:5/6;background:linear-gradient(135deg,rgba(124,108,255,.10),rgba(34,230,255,.06))}
.skeleton-line{height:11px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.12),rgba(255,255,255,.06));background-size:200% 100%;animation:skeletonLine 1.4s linear infinite;margin:9px 10px 0}
@keyframes skeletonLine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.card{position:relative;background:var(--surface);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;transition:.22s cubic-bezier(.2,.7,.3,1);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:0 1px 0 var(--glass-hi) inset,0 8px 22px rgba(0,0,0,.14)}
.card:hover{transform:translateY(-3px);border-color:rgba(124,108,255,.5);box-shadow:0 1px 0 var(--glass-hi) inset,0 14px 34px rgba(50,40,150,.22),0 0 24px rgba(124,108,255,.20)}
.photo{aspect-ratio:5/6;background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(34,230,255,.10));position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}
.card:hover .photo img{transform:scale(1.05)}
.badge{position:absolute;top:8px;left:8px;background:rgba(7,9,18,.7);color:#fff;padding:4px 8px;border-radius:7px;font-size:10px;font-weight:750;border:1px solid rgba(255,255,255,.14);z-index:2}
.content{padding:10px 10px 11px}
.topline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.name{font-weight:750;font-size:12.5px;line-height:1.25;letter-spacing:-.15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.seller{color:var(--muted);font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-weight:800;font-size:12.5px;letter-spacing:-.3px;white-space:nowrap;color:var(--text)}
.qc{color:var(--muted);font-size:10px;text-align:right;margin-top:2px;white-space:nowrap}
.kb-label{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:750;color:#ff7135;letter-spacing:.3px;text-transform:uppercase;margin-bottom:5px}
.actions{display:grid;gap:5px}
.action{height:32px;border:1px solid var(--glass-border);border-radius:9px;background:rgba(255,255,255,.03);color:var(--text);font-weight:650;font-size:11px;cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.action:hover{border-color:rgba(124,108,255,.55);background:rgba(124,108,255,.12)}
.action.kb{background:linear-gradient(135deg,#ff5c1f,#e6260a);border-color:rgba(255,120,60,.65);color:#fff;font-weight:800;font-size:12px;height:36px;box-shadow:0 4px 16px rgba(230,38,10,.42)}
.action.kb:hover{background:linear-gradient(135deg,#ff7135,#ff2e0f);box-shadow:0 6px 24px rgba(255,60,20,.6);transform:translateY(-1px)}
.action.taobao{background:transparent;color:var(--muted);font-weight:500;font-size:10px;height:22px;border-color:transparent;padding:0}
.action.taobao:hover{color:var(--text);text-decoration:underline}
.action.edit{background:linear-gradient(135deg,rgba(124,108,255,.16),rgba(34,230,255,.10));border-color:rgba(124,108,255,.45);font-size:10px;height:26px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;grid-column:1/-1}
</style>
<style>
.modal{position:fixed;inset:0;background:rgba(4,6,14,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:light-dark(rgba(255,255,255,.94),rgba(13,18,32,.88));border:1px solid var(--glass-border);border-radius:18px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.55);backdrop-filter:blur(28px) saturate(150%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{margin:0;letter-spacing:-.4px}
.close{border:0;background:var(--surface2);color:var(--text);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px}
.close:hover{background:rgba(124,108,255,.18)}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.admin-grid input,.admin-grid textarea{width:100%;border:1px solid var(--glass-border);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px;font:inherit;font-size:13px}
.admin-grid input:focus,.admin-grid textarea:focus{outline:none;border-color:rgba(124,108,255,.6);box-shadow:0 0 0 3px rgba(124,108,255,.14)}
.admin-grid textarea{min-height:70px;resize:vertical}
.admin-wide{grid-column:1/-1}
.admin-section{grid-column:1/-1;font-size:11px;font-weight:750;color:#ff7135;text-transform:uppercase;letter-spacing:.6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--glass-border)}
.admin-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.admin-note{color:var(--muted);font-size:12px;margin:5px 0 0}
.upload-row{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload-row input[type=file]{display:none}
.upload-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed rgba(124,108,255,.45);background:rgba(124,108,255,.08);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:650}
.upload-btn:hover{border-color:var(--accent);background:rgba(124,108,255,.16)}
.thumb-strip{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--glass-border);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:19px;height:19px;border:0;border-radius:50%;background:rgba(7,9,18,.88);color:#fff;cursor:pointer;font-size:11px;line-height:1}
.fab{position:fixed;right:22px;bottom:22px;width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-size:22px;cursor:pointer;box-shadow:0 10px 30px rgba(124,108,255,.5);display:none;z-index:4}
.fab.show{display:grid;place-items:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;background:linear-gradient(135deg,var(--accent),#8d5cff);color:#fff;padding:10px 16px;border-radius:12px;font-size:12.5px;font-weight:650;transition:.22s;z-index:10;box-shadow:0 12px 30px rgba(124,108,255,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.banner{font-size:11px;flex-wrap:wrap;text-align:center}.wrap{padding:16px 14px 40px}.admin-grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"><main class="wrap">
<header>
  <div class="brand"><div class="mark">RI</div><div><h1>Replica Index</h1><p>Independent fashion catalogue</p></div></div>
  <div class="header-actions">
    <button class="btn" id="authBtn">Log in</button>
    <button class="btn kb" id="addBtn" style="display:none">+ Add item</button>
  </div>
</header>

<div class="banner">
  <svg class="cn-flag" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="30" height="20" fill="#de2910"/>
    <g fill="#ffde00">
      <path d="M5 2.5 L5.9 5 L8.5 5 L6.4 6.6 L7.2 9.2 L5 7.6 L2.8 9.2 L3.6 6.6 L1.5 5 L4.1 5 Z"/>
      <circle cx="10.2" cy="2" r="0.7"/>
      <circle cx="11.6" cy="3.7" r="0.7"/>
      <circle cx="11.6" cy="5.9" r="0.7"/>
      <circle cx="10.2" cy="7.6" r="0.7"/>
    </g>
  </svg>
  <span>Discover Chinese brands —</span>
  <a href="https://ikako.vip/r/9enta" target="_blank" rel="noopener">sign up to Kakobuy free for ¥3000 credit ↗</a>
</div>

<section class="hero">
  <h2>Curated Chinese fashion finds.</h2>
  <p>Buy direct from Taobao. Get ¥3000 free credit on Kakobuy.</p>
  <div class="hero-cta">
    <a class="btn kb" href="https://ikako.vip/r/9enta" target="_blank" rel="noopener">🏆 Sign up with Kakobuy — free ¥3000 credit ↗</a>
  </div>
</section>

<div class="toolbar"><div><span class="mono" id="count">…</span></div></div>
<section class="grid" id="grid"></section>
</main></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="adminModal"><div class="modal-box" id="adminBox"></div></div>
<div class="modal" id="authModal"><div class="modal-box" id="authBox"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const SUPABASE_URL='https://xbhqvoapbfhyhcrhafxm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhiaHF2b2FwYmZoeWhjcmhhZnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjUxNTcsImV4cCI6MjEwNjUwMTE1N30.w-AH-743HhJjDwazZg-AdkuotzANoCd7kwXH6exIo-g';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const AFF='https://ikako.vip/r/9enta';

let products=[];
let currentUser=null;

function showSkeletons(){
  const grid=$('#grid');
  if(!grid||grid.children.length) return;
  grid.innerHTML=Array.from({length:5}).map(()=>`
    <div class="skeleton-card">
      <div class="skeleton-photo"></div>
      <div class="skeleton-line" style="width:70%"></div>
      <div class="skeleton-line" style="width:40%"></div>
    </div>`).join('');
}

async function loadProducts(){
  showSkeletons();
  const {data,error}=await sb.from('products').select('*').order('id');
  if(error){console.error(error);showToast('Could not load items.');return}
  products=(data||[]).map(row=>{
    const imgs=Array.isArray(row.images)?row.images.filter(Boolean):[];
    const main=imgs[0]||row.image||'';
    return {
      id:row.id,name:row.name,brand:row.brand,category:row.category,
      seller:row.seller,rating:row.rating,qc:row.qc,cny:row.cny,status:row.status,
      image:main,images:imgs.length?imgs:(main?[main]:[]),
      productLink:row.product_link,
      kakobuyLink:row.kakobuy_link,
      affiliateLink:row.affiliate_link,
      notes:row.notes
    };
  });
  render();
}

function refreshAuthUI(){
  $('#addBtn').style.display=currentUser?'':'none';
  $('#fab').classList.toggle('show',!!currentUser);
  $('#authBtn').textContent=currentUser?'Log out':'Log in';
}

function openAuth(){
  if(currentUser){sb.auth.signOut().then(()=>{currentUser=null;refreshAuthUI();showToast('Logged out.')});return}
  $('#authBox').innerHTML=`
    <div class="modal-head"><div><h3>Admin login</h3></div><button class="close" onclick="closeAuth()">×</button></div>
    <div class="admin-grid">
      <input class="admin-wide" id="authEmail" type="email" placeholder="Email" autocomplete="username">
      <input class="admin-wide" id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="admin-actions">
      <button class="btn" onclick="closeAuth()">Cancel</button>
      <button class="btn kb" id="authSubmit">Log in</button>
    </div>`;
  $('#authModal').classList.add('open');
  $('#authSubmit').onclick=async()=>{
    const {data,error}=await sb.auth.signInWithPassword({
      email:$('#authEmail').value.trim(),
      password:$('#authPass').value
    });
    if(error){showToast('Login failed: '+error.message);return}
    currentUser=data.user;closeAuth();refreshAuthUI();showToast('Logged in.');
  };
}
function closeAuth(){$('#authModal').classList.remove('open')}
function closeAdmin(){$('#adminModal').classList.remove('open')}

function render(){
  const grid=$('#grid');
  $('#count').textContent=products.length+(products.length===1?' item':' items');
  if(!products.length){
    grid.innerHTML=`<div class="empty">No items yet.</div>`;
    return;
  }
  grid.innerHTML=products.map((p,i)=>card(p,i)).join('');
}

function card(p,i){
  const kbLink=p.kakobuyLink||p.affiliateLink||AFF;
  const kb=`<a class="action kb" href="${kbLink}" target="_blank" rel="noopener">🏆 Buy via Kakobuy — gift + shipping</a>`;
  const taobao=p.productLink?`<a class="action taobao" href="${p.productLink}" target="_blank" rel="noopener">Taobao listing ↗</a>`:'';
  const edit=currentUser?`<button class="action edit" onclick="openAdmin(${p.id})">✎ Edit</button>`:'';
  const price=p.cny?`<div class="price mono">¥${p.cny}</div>`:'';
  const priority=i<5?'fetchpriority="high"':'';
  return `<article class="card">
    <div class="photo">
      <img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async" ${priority} onerror="this.style.opacity=0">
      <span class="badge">${p.status||''}</span>
    </div>
    <div class="content">
      <div class="topline">
        <div style="min-width:0;flex:1"><div class="name">${p.name}</div><div class="seller">${p.brand||''}${p.seller?' · '+p.seller:''}</div></div>
        <div>${price}<div class="qc">${p.qc||0} QC</div></div>
      </div>
      <div class="kb-label">🏆 Best price via Kakobuy</div>
      <div class="actions">${kb}${taobao}${edit}</div>
    </div>
  </article>`;
}

let draftImages=[];
function renderThumbs(){
  const wrap=$('#thumbStrip');
  if(!wrap) return;
  wrap.innerHTML=draftImages.map((u,i)=>`<div class="thumb"><img src="${u}" decoding="async"><button onclick="removeThumb(${i})">×</button></div>`).join('');
}
function removeThumb(i){draftImages.splice(i,1);renderThumbs()}
async function handleUpload(files){
  if(!currentUser){showToast('Log in first.');return}
  for(const file of files){
    const ext=file.name.split('.').pop().toLowerCase();
    const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from('item-images').upload(path,file,{cacheControl:'31536000',upsert:false});
    if(error){console.error(error);showToast('Upload failed: '+error.message);continue}
    const {data}=sb.storage.from('item-images').getPublicUrl(path);
    draftImages.push(data.publicUrl);
  }
  renderThumbs();
  showToast('Uploaded.');
}

function openAdmin(id=null){
  if(!currentUser){showToast('Log in first.');return}
  const p=id?products.find(x=>x.id===id):null;
  draftImages=p&&p.images?[...p.images]:[];
  $('#adminBox').innerHTML=`
    <div class="modal-head"><div><h3>${p?'Edit item':'Add item'}</h3><p class="admin-note">Details, images, and the three links for this item.</p></div><button class="close" onclick="closeAdmin()">×</button></div>
    <div class="admin-grid">
      <input id="aName" placeholder="Product name" value="${p?.name||''}">
      <input id="aBrand" placeholder="Brand" value="${p?.brand||''}">
      <input id="aCategory" placeholder="Category" value="${p?.category||''}">
      <input id="aSeller" placeholder="Seller" value="${p?.seller||''}">
      <input id="aPrice" type="number" placeholder="Price (CNY)" value="${p?.cny||''}">
      <input id="aRating" type="number" step=".1" min="0" max="5" placeholder="Rating" value="${p?.rating||''}">
      <input class="admin-wide" id="aStatus" placeholder="Status" value="${p?.status||'In stock'}">
      <div class="upload-row">
        <label class="upload-btn" for="aFiles">⬆ Upload images</label>
        <input id="aFiles" type="file" accept="image/*" multiple>
        <span class="admin-note">Uploads come first.</span>
      </div>
      <div class="thumb-strip" id="thumbStrip"></div>
      <input class="admin-wide" id="aImage" placeholder="Fallback image URL (optional)" value="${p?.image||''}">

      <div class="admin-section">Links</div>
      <input class="admin-wide" id="aAffiliate" placeholder="Affiliate link — your signup link (used if no Kakobuy link below)" value="${p?.affiliateLink||''}">
      <input class="admin-wide" id="aProduct" placeholder="Taobao link — direct listing (shown as small grey link)" value="${p?.productLink||''}">
      <input class="admin-wide" id="aKakobuy" placeholder="Kakobuy link for this item — the big orange button" value="${p?.kakobuyLink||''}">

      <textarea class="admin-wide" id="aNotes" placeholder="Notes">${p?.notes||''}</textarea>
    </div>
    <div class="admin-actions">
      ${p?'<button class="btn" style="color:#ff4fd8" id="aDelete">Delete</button>':''}
      <button class="btn" onclick="closeAdmin()">Cancel</button>
      <button class="btn kb" id="aSave">${p?'Save':'Add'}</button>
    </div>`;
  $('#adminModal').classList.add('open');
  renderThumbs();
  $('#aFiles').onchange=e=>handleUpload(e.target.files);
  $('#aSave').onclick=()=>saveAdmin(p?.id||null);
  if(p) $('#aDelete').onclick=()=>deleteAdmin(p.id);
}

async function saveAdmin(id){
  if(!currentUser){showToast('Not logged in.');return}
  const urlImage=$('#aImage').value.trim();
  const finalImages=[...draftImages];
  if(urlImage&&!finalImages.includes(urlImage)) finalImages.push(urlImage);
  const data={
    name:$('#aName').value.trim(),
    brand:$('#aBrand').value.trim(),
    category:$('#aCategory').value.trim()||'Other',
    seller:$('#aSeller').value.trim(),
    cny:Number($('#aPrice').value)||0,
    rating:Number($('#aRating').value)||0,
    qc:finalImages.length,
    status:$('#aStatus').value.trim()||'In stock',
    image:finalImages[0]||urlImage||'',
    images:finalImages,
    product_link:$('#aProduct').value.trim(),
    kakobuy_link:$('#aKakobuy').value.trim(),
    affiliate_link:$('#aAffiliate').value.trim(),
    notes:$('#aNotes').value.trim()
  };
  if(!data.name){showToast('Add a name first.');return}
  let error;
  if(id){({error}=await sb.from('products').update(data).eq('id',id))}
  else{({error}=await sb.from('products').insert(data))}
  if(error){console.error(error);showToast('Save failed: '+error.message);return}
  closeAdmin();
  await loadProducts();
  showToast(id?'Updated.':'Added.');
}

async function deleteAdmin(id){
  if(!currentUser){showToast('Not logged in.');return}
  if(!confirm('Delete this item permanently?')) return;
  const {error}=await sb.from('products').delete().eq('id',id);
  if(error){showToast('Delete failed: '+error.message);return}
  closeAdmin();
  await loadProducts();
  showToast('Deleted.');
}

$('#authBtn').onclick=openAuth;
$('#addBtn').onclick=()=>openAdmin();
$('#fab').onclick=()=>openAdmin();
$('#authModal').onclick=e=>{if(e.target.id==='authModal')closeAuth()};
$('#adminModal').onclick=e=>{if(e.target.id==='adminModal')closeAdmin()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAuth();closeAdmin()}
});

function showToast(t){
  const x=$('#toast');
  x.textContent=t;x.classList.add('show');
  setTimeout(()=>x.classList.remove('show'),2200);
}

(async()=>{
  const {data}=await sb.auth.getSession();
  currentUser=data?.session?.user||null;
  refreshAuthUI();
  await loadProducts();
})();

sb.auth.onAuthStateChange((_e,session)=>{
  currentUser=session?.user||null;
  refreshAuthUI();
});
</script></body></html>
