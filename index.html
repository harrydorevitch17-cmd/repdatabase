<style>

  --surface2: light-dark(rgba(240,244,255,.6),rgba(20,27,46,.55));

  --glass-hi: light-dark(rgba(255,255,255,.9),rgba(255,255,255,.14));

  --muted: light-dark(#5c6b8a,#8e99b8);

  --accent: light-dark(#5b4bff,#7c6cff);

  --pink:#ff4fd8;
  --green:#46e6a5;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

#app{min-height:100vh;background:

  var(--bg)}
.wrap{max-width:1400px;margin:auto;padding:26px 26px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px;box-shadow:0 0 22px rgba(124,108,255,.45)}
.brand h1{font-size:19px;margin:0;letter-spacing:-.5px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn,.select,.search{
  border:1px solid var(--glass-border);

  color:var(--text);
  border-radius:12px;
  height:38px;
  padding:0 13px;
  font:inherit;
  font-size:13.5px;
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 1px 0 var(--glass-hi) inset;
  transition:.18s;
}
.btn{cursor:pointer}
.btn:hover{border-color:rgba(124,108,255,.55);background:var(--surface2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#8d5cff);color:var(--accentText);border-color:transparent;font-weight:650;box-shadow:0 6px 22px rgba(124,108,255,.36)}
.btn.primary:hover{box-shadow:0 8px 28px rgba(124,108,255,.48)}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;margin:0 0 24px;

.heart.saved{color:var(--pink);box-shadow:0 0 14px rgba(255,79,216,.4)}
.content{padding:12px 12px 13px}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:750;font-size:13.5px;letter-spacing:-.2px;line-height:1.25}
.seller{color:var(--muted);font-size:11px;margin-top:3px}
.price{font-weight:800;font-size:13px;white-space:nowrap;letter-spacing:-.3px}
.subprice{color:var(--muted);font-size:10px;text-align:right;margin-top:2px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding-top:9px;border-top:1px solid var(--glass-border);font-size:11px;color:var(--muted)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.action{height:30px;border:1px solid var(--glass-border);border-radius:9px;background:rgba(255,255,255,.03);color:var(--text);font-weight:650;font-size:10.5px;cursor:pointer;transition:.16s}
.action:hover{border-color:rgba(124,108,255,.55);background:rgba(124,108,255,.12)}
.action.aff{grid-column:1/-1;height:32px;background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5,#22e6ff,#46e6a5,#ffe66d,#ff3cac);background-size:300% 100%;color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(255,79,216,.24),0 0 22px rgba(34,230,255,.16);animation:rainbow 5s linear infinite;font-size:11px;font-weight:800;letter-spacing:.2px}

.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:20px;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,rgba(124,108,255,.2),rgba(34,230,255,.1));display:grid;place-items:center;font-size:26px;border:1px solid rgba(124,108,255,.3)}

.modal{position:fixed;inset:0;background:rgba(4,6,14,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}

.close{border:0;background:var(--surface2);color:var(--text);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px}

.thumb{position:relative;width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--glass-border);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:19px;height:19px;border:0;border-radius:50%;background:rgba(7,9,18,.88);color:#fff;cursor:pointer;font-size:11px;line-height:1}
.fab{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-size:24px;font-weight:300;cursor:pointer;

.fab:hover{transform:scale(1.08)}

@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

      <input class="admin-wide" id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="admin-actions">
      <button class="btn" onclick="closeAuth()">Cancel</button>
      <button class="btn primary" id="authSubmit">Log in</button>
    </div>`;
  $('#authModal').classList.add('open');
  $('#authSubmit').onclick = async () => {
    const email = $('#authEmail').value.trim();
    const password = $('#authPass').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showToast('Login failed: ' + error.message); return; }
    currentUser = data.user; closeAuth(); refreshAuthUI(); showToast('Logged in.');
  };
}
function closeAuth(){ $('#authModal').classList.remove('open'); }

let currency='AUD',active='All',query='',sort='featured';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency}).format(n*rates[currency]);

function renderTabs(){
  const counts={};
  products.forEach(p=>{ counts[p.category]=(counts[p.category]||0)+1; });
  const cats=['All',...new Set(products.map(p=>p.category))];
  $('#tabs').innerHTML=cats.map(c=>{
    const n = c==='All' ? products.length : (counts[c]||0);
    return `<button class="tab ${active===c?'active':''}" onclick="setCat('${c}')">${c}<span class="tab-count">(${n})</span></button>`;
  }).join('');
}

function filtered(){
  let a=products.filter(p=>(active==='All'||p.category===active)&&(`${p.name} ${p.brand} ${p.seller}`.toLowerCase().includes(query.toLowerCase())));
  if($('#savedBtn').dataset.active==='1')a=a.filter(p=>saved.has(p.id));
  if(sort==='low')a.sort((a,b)=>a.cny-b.cny);
  if(sort==='high')a.sort((a,b)=>b.cny-a.cny);
  if(sort==='newest')a.sort((a,b)=>b.id-a.id);
  if(sort==='rating')a.sort((a,b)=>b.rating-a.rating);
  return a;
}

function render(){
  renderTabs();
  const a=filtered();
  $('#count').innerHTML=`<span class="mono">${a.length}</span> ${a.length===1?'item':'items'}`;
  if(a.length){
    $('#grid').innerHTML=a.map(card).join('');
  } else if(query || active!=='All' || $('#savedBtn').dataset.active==='1'){
    $('#grid').innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><h3>Nothing matches</h3><p>Try a different search or <a href="#" onclick="resetFilters();return false">clear filters</a>.</p></div>`;
  } else {
    $('#grid').innerHTML=`<div class="empty"><div class="empty-icon">◇</div><h3>No items yet</h3><p>Check back soon.</p></div>`;
  }
}

function resetFilters(){
  active='All'; query=''; $('#search').value='';
  $('#savedBtn').dataset.active='0'; $('#savedBtn').textContent='♡ Saved';
  render();
}

function card(p){
  return `<article class="card">
    <div class="photo">
      <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.opacity=0">
      <span class="badge">${p.status}</span>
      <button class="heart ${saved.has(p.id)?'saved':''}" onclick="toggleSave(${p.id})">${saved.has(p.id)?'♥':'♡'}</button>
    </div>
    <div class="content">
      <div class="topline">
        <div><div class="name">${p.name}</div><div class="seller">${p.brand} · ${p.seller}</div></div>
        <div><div class="price mono">${money(p.cny)}</div><div class="subprice mono">¥${p.cny}</div></div>
      </div>
      <div class="meta"><span class="rating">★ ${p.rating}</span><span>▣ ${p.qc} QC</span></div>
      <div class="actions">
        <button class="action" onclick="openProduct(${p.id})">Product ↗</button>
        <button class="action" onclick="openQC(${p.id})">QC photos</button>
        <button class="action aff" onclick="openAffiliate(${p.id})">Click to purchase ↗</button>
        ${currentUser?`<button class="action edit" onclick="openAdmin(${p.id})">✎ Edit item</button>`:''}
      </div>
    </div>
  </article>`;
}

function openProduct(id){window.open(products.find(p=>p.id===id).links.product,'_blank','noopener')}
function openAffiliate(id){window.open(products.find(p=>p.id===id).links.affiliate,'_blank','noopener')}

function openQC(id){
  const p=products.find(p=>p.id===id);
  const imgs = (p.images && p.images.length ? p.images : (p.image ? [p.image] : []));
  const gallery = imgs.length
    ? imgs.map((u,i)=>`<img src="${u}" alt="QC photo ${i+1}" loading="lazy" onclick="window.open('${u}','_blank','noopener')">`).join('')
    : `<div class="detail" style="grid-column:1/-1">No images yet.</div>`;

  // Related items: same category, excluding current
  const related = products.filter(x=>x.id!==p.id && x.category===p.category).slice(0,3);
  const relatedHtml = related.length ? `<div class="related"><h4>More in ${p.category}</h4><div class="related-row">${related.map(r=>`<div class="related-item" onclick="openQC(${r.id})"><img src="${r.image}" onerror="this.style.opacity=0"><div><div class="rname">${r.name}</div><div class="rprice mono">${money(r.cny)}</div></div></div>`).join('')}</div></div>` : '';

  $('#modalBox').innerHTML=`<div class="modal-head"><div><h3>${p.name}</h3><div class="seller">${p.brand} · ${p.seller}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="gallery">${gallery}</div><div class="details"><div class="detail"><span>Price</span><span class="mono">${money(p.cny)}</span></div><div class="detail"><span>Notes</span>${p.notes||'—'}</div><div class="detail"><span>Seller</span>${p.seller}</div><div class="detail"><span>Images</span><span class="mono">${imgs.length}</span></div></div>${relatedHtml}`;
  $('#modal').classList.add('open');
}

function closeModal(){$('#modal').classList.remove('open')}
function closeAdmin(){$('#adminModal').classList.remove('open')}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);persistSaved();render()}
function setCat(c){active=c;render()}

let draftImages = [];
function renderThumbs(){
  const wrap = $('#thumbStrip');
  if(!wrap) return;
  wrap.innerHTML = draftImages.map((u,i)=>`<div class="thumb"><img src="${u}"><button onclick="removeThumb(${i})">×</button></div>`).join('');
}
function removeThumb(i){ draftImages.splice(i,1); renderThumbs(); }
async function handleUpload(files){
  if(!currentUser){ showToast('Log in first.'); return; }
  for(const file of files){
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await sb.storage.from('item-images').upload(path, file, { cacheControl:'31536000', upsert:false });
    if(error){ console.error(error); showToast('Upload failed: '+error.message); continue; }
    const { data } = sb.storage.from('item-images').getPublicUrl(path);
    draftImages.push(data.publicUrl);
  }
  renderThumbs();
  showToast('Uploaded.');
}

function openAdmin(id=null){
  if(!currentUser){showToast('Log in first.');return}
  const p=id?products.find(x=>x.id===id):null;
  draftImages = p && p.images ? [...p.images] : [];
  $('#adminBox').innerHTML=`<div class="modal-head"><div><h3>${p?'Edit item':'Add item'}</h3><p class="admin-note">Owner controls — manage catalogue details and affiliate links.</p></div><button class="close" onclick="closeAdmin()">×</button></div><div class="admin-grid"><input id="aName" placeholder="Product name" value="${p?.name||''}"><input id="aBrand" placeholder="Brand" value="${p?.brand||''}"><input id="aCategory" placeholder="Category" value="${p?.category||''}"><input id="aSeller" placeholder="Seller" value="${p?.seller||''}"><input id="aPrice" type="number" placeholder="Price (CNY)" value="${p?.cny||''}"><input id="aRating" type="number" step=".1" min="0" max="5" placeholder="Rating" value="${p?.rating||''}"><input id="aQc" type="number" min="0" placeholder="QC photo count" value="${p?.qc||''}"><input id="aStatus" placeholder="Status" value="${p?.status||'In stock'}">
  <div class="upload-row">
    <label class="upload-btn" for="aFiles">⬆ Upload images</label>
    <input id="aFiles" type="file" accept="image/*" multiple>
    <span class="admin-note">Uploads come first. URL below is a fallback only.</span>
  </div>
  <div class="thumb-strip" id="thumbStrip"></div>
  <input class="admin-wide" id="aImage" placeholder="Fallback image URL (optional)" value="${p?.image||''}">
  <input class="admin-wide" id="aProduct" placeholder="Product link" value="${p?.links.product||''}"><input class="admin-wide" id="aAffiliate" placeholder="Affiliate link" value="${p?.links.affiliate||''}"><textarea class="admin-wide" id="aNotes" placeholder="Notes">${p?.notes||''}</textarea></div><div class="admin-actions">${p?'<button class="btn" style="color:var(--pink)" id="aDelete">Delete</button>':''}<button class="btn" onclick="closeAdmin()">Cancel</button><button class="btn primary" id="aSave">${p?'Save changes':'Add item'}</button></div>`;
  $('#adminModal').classList.add('open');
  renderThumbs();
  $('#aFiles').onchange = e => handleUpload(e.target.files);
  $('#aSave').onclick=()=>saveAdmin(p?.id||null);
  if(p) $('#aDelete').onclick=()=>deleteAdmin(p.id);
}

async function saveAdmin(id){
  if(!currentUser){showToast('Not logged in.');return}
  const urlImage = $('#aImage').value.trim();
  const finalImages = [...draftImages];
  if(urlImage && !finalImages.includes(urlImage)) finalImages.push(urlImage);
  const data={
    name:$('#aName').value.trim(),
    brand:$('#aBrand').value.trim(),
    category:$('#aCategory').value.trim()||'Other',
    seller:$('#aSeller').value.trim(),
    cny:Number($('#aPrice').value)||0,
    rating:Number($('#aRating').value)||0,
    qc:Number($('#aQc').value)||finalImages.length,
    status:$('#aStatus').value.trim()||'In stock',
    image: finalImages[0] || urlImage || '',
    images: finalImages,
    product_link:$('#aProduct').value.trim(),
    affiliate_link:$('#aAffiliate').value.trim(),
    notes:$('#aNotes').value.trim()
  };
  if(!data.name){showToast('Add a product name first.');return}
  let error;
  if(id){ ({error} = await sb.from('products').update(data).eq('id',id)); }
  else  { ({error} = await sb.from('products').insert(data)); }
  if(error){console.error(error);showToast('Save failed: '+error.message);return}
  closeAdmin();
  await loadProducts();
  showToast(id?'Item updated.':'Item added.');
}

async function deleteAdmin(id){
  if(!currentUser){showToast('Not logged in.');return}
  if(!confirm('Delete this item permanently?')) return;
  const { error } = await sb.from('products').delete().eq('id',id);
  if(error){console.error(error);showToast('Delete failed: '+error.message);return}
  closeAdmin();
  await loadProducts();
  showToast('Item deleted.');
}

$('#currency').onchange=e=>{currency=e.target.value;render()};
$('#search').oninput=e=>{query=e.target.value;render()};
$('#sort').onchange=e=>{sort=e.target.value;render()};
$('#savedBtn').onclick=()=>{$('#savedBtn').dataset.active=$('#savedBtn').dataset.active==='1'?'0':'1';$('#savedBtn').textContent=$('#savedBtn').dataset.active==='1'?'♥ Saved':'♡ Saved';render()};
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#adminModal').onclick=e=>{if(e.target.id==='adminModal')closeAdmin()};
$('#authModal').onclick=e=>{if(e.target.id==='authModal')closeAuth()};
$('#addBtn').onclick=()=>openAdmin();
$('#fab').onclick=()=>openAdmin();
$('#authBtn').onclick=openAuth;

// Press "/" to focus search
document.addEventListener('keydown', (e)=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); $('#search').focus();
  }
  if(e.key==='Escape'){ closeModal(); closeAdmin(); closeAuth(); }
});

function showToast(t){
  const x=$('#toast');
  x.textContent=t;
  x.classList.add('show');
  setTimeout(()=>x.classList.remove('show'),2200);
}

function decorateCards(){
  document.querySelectorAll('.card').forEach(c=>{
    if(!c.querySelector('.discount-link')){
      const a=document.createElement('a');
      a.className='discount-link';
      a.href='https://ikako.vip/r/9enta';
      a.target='_blank';
      a.rel='noopener';
      a.textContent='Click me for mega discounts ↗';
      c.querySelector('.actions').before(a);
    }
  });
}

(async () => {
  const { data } = await sb.auth.getSession();
  currentUser = data?.session?.user || null;
  refreshAuthUI();
  await loadProducts();
})();

sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
  refreshAuthUI();
});
</script></body></html>
